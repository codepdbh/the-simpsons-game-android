plugins { id 'com.android.application' }
android {
    namespace 'org.tsg.android'
    compileSdk 35
    ndkVersion '28.2.13676358'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    defaultConfig {
        applicationId 'org.tsg.android'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName project.hasProperty('withGame') ? '0.2.0-experimental' : '0.2.0-diagnostic'
        buildConfigField 'boolean', 'WITH_GAME', project.hasProperty('withGame') ? 'true' : 'false'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake {
            arguments '-DANDROID_STL=c++_shared', "-DTSG_BUILD_GAME=${project.hasProperty('withGame') ? 'ON' : 'OFF'}"
            targets 'main', 'SDL3-shared'
            if (project.hasProperty('withGame')) targets 'tsg_game', 'rexgpu-xenos', 'rexruntime', 'rex_android_gpu_driver'
        } }
    }
    buildFeatures { buildConfig true }
    sourceSets.main.java.srcDirs += [project.hasProperty('withGame') ? '../extern/android-reference/sdk/thirdparty/sdl3/android-project/app/src/main/java' : '../extern/SDL/android-project/app/src/main/java']
    externalNativeBuild { cmake { path '../CMakeLists.txt'; version '3.30.5' } }
    buildTypes {
        debug { debuggable true; jniDebuggable true }
        release { minifyEnabled false }
    }
}
